<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manual - DivAlarm</title>
    <meta http-equiv="refresh" content="0; url=../user-manual.html" />
    <script>
      (function () {
        var target = "../user-manual.html";
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        if (!hash) {
          var path = window.location.pathname || "";
          var m = path.match(/\/user-manual\/([^\/]+)\/?$/);
          if (m && m[1]) hash = "#" + m[1];
        }
        window.location.replace(target + search + hash);
      })();
    </script>
  </head>
  <body>
    <p>
      Перенаправление… Если ничего не произошло,
      <a href="../user-manual.html">откройте руководство</a>.
    </p>
  </body>
</html>
