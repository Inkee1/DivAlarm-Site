<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>TradingView Webhook 가이드 - DivAlarm</title>
<meta content="0; url=../tradingview-webhook.html" http-equiv="refresh"/>
<script>
      (function () {
        // Support:
        //   /en/tradingview-webhook#keyword  -> /en/tradingview-webhook.html#keyword
        //   /en/tradingview-webhook/keyword  -> /en/tradingview-webhook.html#keyword
        var target = "../tradingview-webhook.html";
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        if (!hash) {
          var path = window.location.pathname || "";
          var m = path.match(/\/tradingview-webhook\/([^\/]+)\/?$/);
          if (m && m[1]) hash = "#" + m[1];
        }
        window.location.replace(target + search + hash);
      })();
    </script>
</head>
<body>
<p>
      이동 중… 아무 일도 일어나지 않으면,
      <a href="../tradingview-webhook.html">가이드를 여세요</a>.
    </p>
</body>
</html>
