<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open DivAlarm</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1116;
      color: #f5f7fb;
    }
    main {
      width: min(92vw, 420px);
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(19, 23, 34, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.55;
      color: #c7cfdb;
    }
    .actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }
    a.button {
      display: inline-block;
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    a.primary {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: #fff;
    }
    a.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #f5f7fb;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #9aa6b2;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening DivAlarm</h1>
    <p>If the app does not open automatically, use the buttons below.</p>
    <div class="actions">
      <a id="open-app" class="button primary" href="divalarm://divalarm.com">Open DivAlarm App</a>
      <a class="button secondary" href="https://play.google.com/store/apps/details?id=com.flutterflow.divalarm2">Get DivAlarm on Google Play</a>
    </div>
    <div class="status" id="status">Trying to open the app...</div>
  </main>
  <script>
    (() => {
      const appUrl = "divalarm://divalarm.com";
      const storeUrl = "https://play.google.com/store/apps/details?id=com.flutterflow.divalarm2";
      const status = document.getElementById("status");
      let fallbackTimer = null;

      function clearFallback() {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
      }

      function goToStore() {
        clearFallback();
        window.location.replace(storeUrl);
      }

      function tryOpenApp() {
        clearFallback();
        fallbackTimer = window.setTimeout(() => {
          if (!document.hidden) {
            if (status) {
              status.textContent = "App not detected. Redirecting to Google Play...";
            }
            goToStore();
          }
        }, 1500);

        window.location.href = appUrl;
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearFallback();
        }
      });

      window.addEventListener("pagehide", clearFallback);
      window.addEventListener("blur", clearFallback);
      window.addEventListener("load", () => {
        window.setTimeout(tryOpenApp, 80);
      });

      document.getElementById("open-app")?.addEventListener("click", () => {
        if (status) {
          status.textContent = "Trying to open the app...";
        }
      });
    })();
  </script>
</body>
</html>
