<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<meta name="robots" content="noindex">
<title>Redirecting...</title>
<script>
  (function () {
    var supported = [
      "en", "ko", "ru", "vi", "tr", "pt-br", "uk", "id",
      "ja", "de", "ur", "fil", "th", "ms", "zh-hans", "es"
    ];
    var aliases = {
      pt: "pt-br",
      "pt-pt": "pt-br",
      tl: "fil",
      zh: "zh-hans",
      "zh-cn": "zh-hans",
      "zh-sg": "zh-hans",
      "zh-hans-cn": "zh-hans",
      "zh-hans-sg": "zh-hans"
    };
    var supportedSet = {};
    supported.forEach(function (code) { supportedSet[code] = true; });

    function resolve(tag) {
      var t = String(tag || "").toLowerCase().replace(/_/g, "-");
      if (!t) return "";
      if (aliases[t]) t = aliases[t];
      if (supportedSet[t]) return t;
      while (t.indexOf("-") !== -1) {
        t = t.substring(0, t.lastIndexOf("-"));
        if (aliases[t]) t = aliases[t];
        if (supportedSet[t]) return t;
      }
      return aliases[t] || (supportedSet[t] ? t : "");
    }

    function getSavedLang() {
      try {
        return resolve(window.localStorage && window.localStorage.getItem("lang"));
      } catch (e) {
        return "";
      }
    }

    function getQueryLang() {
      try {
        return resolve(new URL(window.location.href).searchParams.get("lang"));
      } catch (e) {
        return "";
      }
    }

    function getNavigatorLang() {
      var list = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      for (var i = 0; i < list.length; i++) {
        var lang = resolve(list[i]);
        if (lang) return lang;
      }
      return "en";
    }

    var lang = getQueryLang() || getSavedLang() || getNavigatorLang();
    var target = "/" + lang + "/survival.html" + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</head>
<body>
<a id="fallback-link" href="/en/survival.html">Continue to survival guide</a>
<script>
  document.getElementById("fallback-link").href =
    "/en/survival.html" + window.location.search + window.location.hash;
</script>
</body>
</html>
