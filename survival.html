  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    main {
      width: min(90vw, 420px);
      padding: 28px 22px;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.82);
    }
    p { color: #cbd5e1; line-height: 1.6; }
    a { color: #38bdf8; font-weight: 700; text-underline-offset: 4px; }
  </style>

<body>
  <main>
    <h1>Opening Survival Guide</h1>
    <p>Redirecting to the best language for your browser.</p>
    <p><a href="/en/survival.html">Continue in English</a></p>
  </main>
  <script>
    const SUPPORTED = [
      "en","ko","ru","vi","tr","pt-br","uk","id","ja","de","ur","fil","th","ms","zh-hans","es"
    ];
    const ALIASES = {
      "pt": "pt-br",
      "pt-pt": "pt-br",
      "tl": "fil",
      "zh": "zh-hans",
      "zh-cn": "zh-hans",
      "zh-sg": "zh-hans",
      "zh-hans-cn": "zh-hans",
      "zh-hans-sg": "zh-hans"
    };
    const supportedSet = new Set(SUPPORTED);
    function normalize(tag) {
      return (tag || "").toLowerCase().replace(/_/g, "-");
    }
    function resolve(tag) {
      let t = normalize(tag);
      if (!t) return "";
      if (ALIASES[t]) t = ALIASES[t];
      if (supportedSet.has(t)) return t;
      while (t.includes("-")) {
        t = t.substring(0, t.lastIndexOf("-"));
        if (ALIASES[t]) t = ALIASES[t];
        if (supportedSet.has(t)) return t;
      }
      return ALIASES[t] || (supportedSet.has(t) ? t : "");
    }
    function pickBestLang() {
      const qsLang = new URLSearchParams(location.search).get("lang");
      let lang = resolve(qsLang);
      if (lang) return lang;
      try {
        lang = resolve(localStorage.getItem("lang"));
        if (lang) return lang;
      } catch (_) {}
      const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const item of list) {
        lang = resolve(item);
        if (lang) return lang;
      }
      return "en";
    }
    const lang = pickBestLang();
    try { localStorage.setItem("lang", lang); } catch (_) {}
    location.replace(`/${lang}/survival.html`);
  </script>
</body>
</html>
