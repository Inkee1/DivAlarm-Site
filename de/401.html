  if (userSnap.exists()) {

  };

// ✅ 그다음에 fetchUserMembershipData 정의
window.fetchUserMembershipData = async function () {
  const user = window.auth?.currentUser;
  console.log("user:", user);
  if (!user) return;
  await user.reload();
  const isEmailVerified = user.emailVerified;
  localStorage.setItem("isEmailVerified", isEmailVerified);
  console.log("📧 이메일 인증 여부:", isEmailVerified);
  const userId = user.uid;
  const db = getFirestore();
  const userRef = doc(db, "users", userId);
  try {
    const userSnap = await getDoc(userRef);
    if (userSnap.exists()) {
      const userData = userSnap.data();
      localStorage.setItem("useremail", userData.email);
      localStorage.setItem("membership", userData.membership);
      localStorage.setItem("expired", userData.expired?.seconds);
      localStorage.setItem("isCanceled", userData.isCanceled);
      localStorage.setItem("wallet", userData.wallet);
      console.log(" useremail:", localStorage.getItem("useremail"));
      console.log(" membership:", localStorage.getItem("membership"));
      console.log(" expired:", localStorage.getItem("expired"));
      console.log(" isCanceled:", localStorage.getItem("isCanceled"));
      console.log("fetch!");
      return userData;
    }
  } catch (err) {
    console.error("🔥 fetchUserMembershipData 실패:", err);
  }
};
document.addEventListener("DOMContentLoaded", () => {
  const authBtn = document.getElementById("sign-btn2");
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ✅ 로그인된 경우: 버튼을 Logout으로 바꿈
      authBtn.textContent = "Logout";
      authBtn.classList.remove("login");
      authBtn.classList.add("logout");
      // 클릭 시 로그아웃 처리
    authBtn.onclick = async (e) => {
      e.preventDefault();
      try {
        await signOut(auth);
        localStorage.clear();
        alert("You have been logged out.");
        window.location.href = "index.html"; // 로그아웃 후 홈으로 이동
      } catch (error) {
        console.error("로그아웃 실패:", error);
        alert("An error occurred while logging out.");
      }
    };
    } else {
      // ✅ 비로그인 상태: 버튼을 Sign In으로
      authBtn.textContent = "Sign In";
      authBtn.classList.remove("logout");
      authBtn.classList.add("login");
      // 클릭 시 로그인 페이지로 이동
      authBtn.onclick = (e) => {
        e.preventDefault();
        window.location.href = "sign-in-page.html";
      };
    }
  });
});
