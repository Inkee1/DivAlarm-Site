  <script type="module">
  import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
  async function googleLogin() {
    // 구글 로그인 함수 - 이메일/비밀번호 검증 없이 실행됨
    const provider = new GoogleAuthProvider(); // Now GoogleAuthProvider is properly imported
    try {
      // 폼 유효성 검사를 건너뛰고 직접 로그인 진행
      const userCredential = await signInWithPopup(window.auth, provider);
      console.log("✅ Google User signed in:", userCredential.user);
      const user = userCredential.user;
      const idToken = await userCredential.user.getIdToken();
      localStorage.setItem("idToken", idToken);
////
    const email = user.email;
    const banCheckRes = await fetch(
      `https://asia-northeast1-divergence-alarm.cloudfunctions.net/sendReferralNotification/check_ban/${encodeURIComponent(email)}`
    );
    const banData = await banCheckRes.json();
    if (banData.banned) {
      alert("🚫 This email was recently used to delete an account. You can sign up again after 7 days.");
      await window.auth.signOut(); // 로그인 해제
      return;
    }
      // ✅ 데이터 동기화 호출
      await maybeCreateUser(user); 
      await fetchUserMembershipData();
      alert("Google Login successful!");
      window.location.href = "go-my-account.html";
    } catch (error) {
      console.error("❌ Google Login error:", error.message);
      alert(error.message);
    }
  }
  document.addEventListener("DOMContentLoaded", function () {
    console.log("DOMContentLoaded fired!");
    console.log("fetchUserMembershipData 존재 여부:", typeof window.fetchUserMembershipData);
    // 구글 로그인 버튼 직접 찾아서 이벤트 리스너 추가 (폼 외부에도 가능)
    const googleLoginBtn = document.getElementById('google');//document.querySelector('input[value="Sign in with Google"], button[value="Sign in with Google"]');
    if (googleLoginBtn) {
      console.log("✅ Google login button found!");
      googleLoginBtn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        console.log("✅ Google login button clicked!");
        googleLogin();
      });
    } else {
      console.error("❌ Google login button not found!");
    }
    const loginForm = document.getElementById("email-form");
    if (!loginForm) {
      console.error("❌ loginForm (email-form) not found!");
      return;
    }
    console.log("✅ loginForm found!");
    loginForm.setAttribute("action", "");
    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      event.stopPropagation();
      console.log("🔥 Submit event detected before preventDefault()!");
      // 클릭한 버튼 확인
      const clickedButton = event.submitter;
      console.log("Clicked Button:", clickedButton.value);
      // ✅ 구글 로그인 버튼을 클릭하면 입력 필드 무시하고 로그인 진행
      if (clickedButton && clickedButton.value === "Sign in with Google") {
        console.log("✅ Handling Google login from form submit...");
        googleLogin();
        return; // ✅ 로그인 후 다른 코드 실행 안 함
      }
      // ✅ Email/Password 로그인 로직
      console.log("✅ Handling Firebase Email/Password login...");
      let emailField = document.getElementById("loginEmail");
      let passwordField = document.getElementById("loginPassword");
      // 🚀 강제로 required 속성을 비활성화 (구글 로그인 클릭 시 문제 해결)
      emailField.removeAttribute("required");
      passwordField.removeAttribute("required");
      let passwordValue = passwordField.value;
      let passwordTextField = document.createElement("input");
      passwordTextField.type = "text";
      passwordTextField.value = passwordValue;
      passwordTextField.style.display = "none";
      loginForm.appendChild(passwordTextField);
      try {
        const userCredential = await signInWithEmailAndPassword(
          window.auth, 
          emailField.value, 
          passwordTextField.value
        );
        console.log("✅ User signed in:", userCredential.user);
        if (!userCredential.user.emailVerified) {
  alert("🚫 Please verify your email before logging in. Check your inbox and click the verification link we sent you. If it’s not there, make sure to look in your spam or junk folder as well.");
  await window.auth.signOut();
  return;
}
        const idToken = await userCredential.user.getIdToken();
				localStorage.setItem("idToken", idToken);
				await maybeCreateUser(userCredential.user); 
        await fetchUserMembershipData();
        alert("Login successful!");
        window.location.href = "go-my-account.html";
      } catch (error) {
        console.error("❌ Login error:", error.message);
        alert(error.message);
      }
    });
  });
