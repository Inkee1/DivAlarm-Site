window.fetchUserMembershipData = async function () {
  const user = window.auth?.currentUser;

  await user.reload();
  const isEmailVerified = user.emailVerified;

  document.addEventListener("DOMContentLoaded", function () {
    console.log("DOMContentLoaded fired!");
    // 구글 로그인 버튼 직접 찾아서 이벤트 리스너 추가 (폼 외부에도 가능)
    const signupForm = document.getElementById("signup-email-form");

    }
    console.log("✅ signupForm found!");
    signupForm.setAttribute("action", "");

      event.preventDefault();
      event.stopPropagation();
      console.log("🔥 Submit event detected before preventDefault()!");
      // 클릭한 버튼 확인
      const clickedButton = event.submitter;
      console.log("Clicked Button:", clickedButton.value);
      // ✅ Email/Password 로그인 로직
      console.log("✅ Handling Firebase Email/Password signup...");
      let emailField = document.getElementById("signupEmail");
      let passwordField = document.getElementById("signupPassword");
      let confirmPasswordField = document.getElementById("confirmPassword");
      // ✅ 비밀번호 일치 여부 확인
      if (passwordField.value !== confirmPasswordField.value) {
        alert("🚫 Passwords do not match. Please re-enter.");
        return;
			}
      emailField.removeAttribute("required");
      passwordField.removeAttribute("required");
      let passwordValue = passwordField.value;
      let passwordTextField = document.createElement("input");
      passwordTextField.type = "text";
      passwordTextField.value = passwordValue;
      passwordTextField.style.display = "none";
      signupForm.appendChild(passwordTextField);
     const email = emailField.value;
    try {
      const banCheckRes = await fetch(`https://us-central1-divergence-alarm.cloudfunctions.net/sendReferralNotification/check_ban/${encodeURIComponent(email)}`);
      const banData = await banCheckRes.json();
      if (banData.banned) {
        alert("🚫 This email was recently used to delete an account. You can sign up again after 7 days.");
        return;
      }
    } catch (err) {
      console.error("❌ Failed to check ban status:", err);
      alert("Network error. Please try again.");
      return;
    }
  try {
    // 1. 이미 가입된 이메일인지 확인

      // 이미 가입된 경우
      alert("This email is already registered. Please sign in.");
      return;
